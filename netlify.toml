# RunsLocal v1.8: Netlify builds the static site from source
[build]
  command = "node build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SITE = "https://runslocalai.com"

# v2.2: crawlers keep asking for WordPress-style sitemap names; point them at the real one
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/wp-sitemap.xml"
  to = "/sitemap.xml"
  status = 301
